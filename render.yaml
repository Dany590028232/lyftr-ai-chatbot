services:
  - type: web
    name: lyftr-ai-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: LLM_API_KEYS
        sync: false          # paste your keys in the Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # your Vercel URL, e.g. https://lyftr-ai-chatbot.vercel.app
      - key: GEMINI_MODEL
        value: gemini/gemini-3.5-flash-lite
      - key: FALLBACK_MODELS
        value: gemini/gemini-3.6-flash
      - key: ENABLE_FAILURE_SIMULATION
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////data/app.db
